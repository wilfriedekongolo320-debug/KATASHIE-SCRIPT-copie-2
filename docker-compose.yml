version: '3.9'

# ════════════════════════════════════════════════════════════════
#  KATASHIE VPN — Docker Compose
# ════════════════════════════════════════════════════════════════
services:
  katashie-web:
    build:
      context: ./nexus-web
      dockerfile: ../Dockerfile.web
    container_name: katashie-web
    restart: unless-stopped
    ports:
      - "2087:2087"
    volumes:
      - katashie-db:/etc/katashie-web
      - katashie-backups:/tmp/katashie_backups
    environment:
      - KATASHIE_DB_DIR=/etc/katashie-web
      - NEXUS_ADMIN_USER=${ADMIN_USER:-admin}
      - NEXUS_ADMIN_PASS=${ADMIN_PASS:-admin123}
      - NEXUS_JWT_SECRET=${JWT_SECRET:-changeme_jwt_secret_CHANGE_ME}
      - KATASHIE_JWT_SECRET=${JWT_SECRET:-changeme_jwt_secret_CHANGE_ME}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT=${TELEGRAM_ADMIN_CHAT:-}
      - CAMPAY_APP_USERNAME=${CAMPAY_APP_USERNAME:-}
      - CAMPAY_APP_PASSWORD=${CAMPAY_APP_PASSWORD:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY:-}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-us-east-1}
    networks: [katashie-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2087/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  katashie-core-bot:
    build:
      context: ./katashie_core_bot
      dockerfile: ../Dockerfile.bot
    container_name: katashie-core-bot
    restart: unless-stopped
    command: ["python3", "-u", "katashie_bot.py"]
    volumes:
      - /etc/katashie_bot:/etc/katashie_bot:ro
      - /var/lib/katashie_bot:/var/lib/katashie_bot
      - /etc/xray:/etc/xray
      - /usr/local/etc/xray:/usr/local/etc/xray
      - /etc/zivpn:/etc/zivpn
    environment:
      - KATASHIE_BOT_CONFIG=/etc/katashie_bot/config.json
      - KATASHIE_BOT_DB=/var/lib/katashie_bot/state.sqlite3
    networks: [katashie-net]
    depends_on:
      katashie-web:
        condition: service_started

  katashie-deploy-bot:
    build:
      context: ./katashie_deploy_bot
      dockerfile: ../Dockerfile.bot
    container_name: katashie-deploy-bot
    restart: unless-stopped
    volumes:
      - /etc/katashie_deploy_bot:/etc/katashie_deploy_bot:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      - KATASHIE_DEPLOY_CONFIG=/etc/katashie_deploy_bot/config.json
    networks: [katashie-net]

  katashie-whatsapp-bot:
    build:
      context: ./katashie_whatsapp_bot
      dockerfile: ../Dockerfile.bot
    container_name: katashie-whatsapp-bot
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /etc/katashie_whatsapp_bot:/etc/katashie_whatsapp_bot:ro
    environment:
      - KATASHIE_WA_CONFIG=/etc/katashie_whatsapp_bot/config.json
    networks: [katashie-net]

  nginx:
    image: nginx:alpine
    container_name: katashie-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    networks: [katashie-net]
    depends_on: [katashie-web]

volumes:
  katashie-db:
  katashie-backups:
  nginx-logs:

networks:
  katashie-net:
    driver: bridge
